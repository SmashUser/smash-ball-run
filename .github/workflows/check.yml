name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the CDK app
        run: npx tsc --noEmit
      - name: Syntax-check the Lambda functions and browser scripts
        run: for f in lambda/*/index.mjs web/app.js web/fighters.js; do node --check "$f"; done
      - name: Synthesize the CloudFormation templates (example settings, no AWS account needed)
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          cp cdk.example.json cdk.json
          npx cdk synth --quiet
